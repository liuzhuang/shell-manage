<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Shell Manage Dock Icon - Spectrum Stack">
  <defs>
    <filter id="C_termShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="38" result="purpleBlur"/>
      <feOffset in="purpleBlur" dx="-10" dy="-8" result="purpleOffset"/>
      <feFlood flood-color="#967dff" flood-opacity="0.34" result="purpleColor"/>
      <feComposite in="purpleColor" in2="purpleOffset" operator="in" result="purpleGlow"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="30" result="blueBlur"/>
      <feOffset in="blueBlur" dx="14" dy="12" result="blueOffset"/>
      <feFlood flood-color="#4777ff" flood-opacity="0.30" result="blueColor"/>
      <feComposite in="blueColor" in2="blueOffset" operator="in" result="blueGlow"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="28" result="shadowBlur"/>
      <feOffset in="shadowBlur" dx="0" dy="24" result="shadowOffset"/>
      <feFlood flood-color="#0e1116" flood-opacity="0.28" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowOffset" operator="in" result="dropShadow"/>

      <feMerge>
        <feMergeNode in="purpleGlow"/>
        <feMergeNode in="blueGlow"/>
        <feMergeNode in="dropShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="C_squircleClip">
      <rect x="60" y="60" width="904" height="904" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#C_squircleClip)">
    <rect x="60" y="60" width="904" height="904" rx="224" ry="224" fill="#ffffff"/>

    <g transform="translate(512 512) scale(1.08) translate(-512 -512)">
      <g filter="url(#C_termShadow)" transform="translate(0 22) rotate(3 512 490)">
      <rect x="216" y="332" width="592" height="372" rx="56" ry="56" fill="#191c22"/>
      <path d="M216 388v-56a56 56 0 0 1 56-56h480a56 56 0 0 1 56 56v56z" fill="#2c3037"/>
      <circle cx="270" cy="360" r="13" fill="#ff5f57"/>
      <circle cx="306" cy="360" r="13" fill="#febc2e"/>
      <circle cx="342" cy="360" r="13" fill="#28c840"/>
      <line x1="216" y1="396" x2="808" y2="396" stroke="#0a0c0e" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M306 466 L406 540 L306 614" stroke="#28c840" stroke-width="34" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="430" y="596" width="124" height="22" rx="11" ry="11" fill="#28c840"/>
      <rect x="572" y="596" width="172" height="22" rx="11" ry="11" fill="#28c840" fill-opacity="0.32"/>
      </g>
    </g>
  </g>

  <rect x="60.5" y="60.5" width="903" height="903" rx="223.5" ry="223.5" fill="none" stroke="#e5e7eb" stroke-width="1"/>
</svg>
